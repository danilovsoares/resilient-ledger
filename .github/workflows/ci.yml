name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend-build-and-unit-tests:
    name: Backend - build e testes de domínio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore Verity.slnx

      - name: Build
        run: dotnet build Verity.slnx --no-restore -c Release

      - name: Testes unitários (Ledger)
        run: dotnet test tests/Verity.Ledger.UnitTests/Verity.Ledger.UnitTests.csproj --no-build -c Release --logger "trx"

      - name: Testes unitários (Daily Balance)
        run: dotnet test tests/Verity.DailyBalance.UnitTests/Verity.DailyBalance.UnitTests.csproj --no-build -c Release --logger "trx"

  backend-integration-tests:
    name: Backend - testes de integração (Testcontainers)
    runs-on: ubuntu-latest
    needs: backend-build-and-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore Verity.slnx

      # O runner ubuntu-latest do GitHub Actions já traz Docker instalado, usado pelo
      # Testcontainers para subir PostgreSQL/RabbitMQ reais durante os testes
      # (ver docs/testing-strategy.md).
      - name: Testes de integração (Ledger)
        run: dotnet test tests/Verity.Ledger.IntegrationTests/Verity.Ledger.IntegrationTests.csproj -c Release --logger "trx"

      - name: Testes de integração (Daily Balance)
        run: dotnet test tests/Verity.DailyBalance.IntegrationTests/Verity.DailyBalance.IntegrationTests.csproj -c Release --logger "trx"

  frontend-build:
    name: Frontend - lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/verity-web
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/verity-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

  e2e-tests:
    name: E2E - jornada do comerciante (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-integration-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack (docker compose)
        run: docker compose up -d --build

      - name: Aguardar as APIs e o frontend ficarem prontos
        run: |
          for url in http://localhost:5080/health/live http://localhost:5081/health/live http://localhost:4201; do
            echo "Aguardando $url..."
            timeout 120 bash -c "until curl -sf $url > /dev/null; do sleep 2; done"
          done

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Instalar dependências
        working-directory: tests/e2e
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        working-directory: tests/e2e
        run: npm test

      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Publicar capturas de tela e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/screenshots/**
            tests/e2e/playwright-report/**
            tests/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
