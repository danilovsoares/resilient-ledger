name: verity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verity_ledger
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity
    ports:
      - "5433:5432"
    volumes:
      - verity-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ledger-api:
    build:
      context: .
      dockerfile: src/Ledger/Verity.Ledger.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LedgerDb: "Host=postgres;Port=5432;Database=verity_ledger;Username=verity;Password=verity"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Jwt__SigningKey: "dev-only-signing-key-not-for-production-use-please-change-me-32bytes+"
      Database__AutoMigrate: "true"
      Auth__SeedDefaultUser: "true"
      Auth__DefaultUser__Username: "comerciante"
      Auth__DefaultUser__Password: "verity123"
      Auth__DefaultUser__DisplayName: "Comerciante"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  daily-balance-api:
    build:
      context: .
      dockerfile: src/DailyBalance/Verity.DailyBalance.Api/Dockerfile
    ports:
      - "5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DailyBalanceDb: "Host=postgres;Port=5432;Database=verity_daily_balance;Username=verity;Password=verity"
      Redis__ConnectionString: "redis:6379"
      Jwt__SigningKey: "dev-only-signing-key-not-for-production-use-please-change-me-32bytes+"
      Database__AutoMigrate: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  daily-balance-worker:
    build:
      context: .
      dockerfile: src/DailyBalance/Verity.DailyBalance.Worker/Dockerfile
    ports:
      - "5082:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DailyBalanceDb: "Host=postgres;Port=5432;Database=verity_daily_balance;Username=verity;Password=verity"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Database__AutoMigrate: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend/verity-web
    ports:
      - "4201:80"
    depends_on:
      - ledger-api
      - daily-balance-api

volumes:
  verity-postgres-data:
