server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # connect-src precisa acompanhar as URLs de API embutidas em src/environments/environment.ts
    # (ver docs/security.md) — se essa estratégia mudar para configuração em runtime, atualizar aqui também.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:5080 http://localhost:5081; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
